services:
  - type: web
    name: visheshmusics
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 300 app:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

      - key: SENDER_EMAIL
        sync: false

      - key: GMAIL_APP_PASSWORD
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_ID
        sync: false

      - key: ADMIN_PASSWORD
        sync: false
